<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kimberly Reddick - Portfolio</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />

    <script src="script.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  </head>
  <body>
    
    <!-- Hero Section -->
    <section id="home" class="hero">
      <div class="container">
        <h1 class="hero-title">Interactive Web Development Portfolio</h1>
        <p class="hero-subtitle">Kimberly Reddick </p>
        <p class="hero-tagline">Software Engineer • Automation Developer • Technical Problem Solver</p>
      </div>
    </section>

    <!-- Projects Section -->
    <section id="projects" class="projects">
      <div class="container">
        <h2 class="section-title">My Projects</h2>
        <div class="projects-grid">
          <!-- Project Cards Go Here -->
        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <div class="container">
        <p>&copy; 2025 Kimberly Reddick. All rights reserved.  Built with <i class="fas fa-heart heart"></i>
        and lots of <img src="./assets/icons/dr-pepper.png" alt="Dr. Pepper" class="dr-pepper"/>.</p>
      </div>
    </footer>

    <button class="floating-contact-btn" id="floatingContactBtn" aria-label="Send Email">
        <i class="fas fa-envelope"></i>
    </button>

    <div class="email-modal" id="emailModal">
        <div class="modal-content">
            <button class="modal-close" id="modalClose" aria-label="Close">&times;</button>
            <h3>Contact Me</h3>
            <form
                  action="https://formspree.io/f/mvgqegwp"
                  method="POST"
                  class="contact-form"
            >
            <div class="form-group">
              <label for="name">Name   </label>
              <input type="text" id="name" name="name" required />
            </div>

            <div class="form-group">
              <label for="email">Email  </label>
              <input type="email" id="email" name="email" required />
            </div>

            <div class="form-group">
              <label for="number">Phone  </label>
              <input type="text" id="number" name="number" />
            </div>

            <div class="form-group">
              <label for="message">Message</label>
              <textarea id="message" name="message" rows="5" required></textarea>
            </div>
            <div class="form-submit">
              <button type="submit" class="btn-secondary">Send Message</button>
            </div>
          </form>
        </div>
    </div>
  </body>
</html>
